<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Event Countdown</title>
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <script src="https://cdn.tailwindcss.com?plugins=forms,typography"></script>
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              primary: "#007AFF", // iOS System Blue
              accent: "#FFD60A", // iOS System Yellow
              "background-light": "#F2F2F7", // iOS System Gray 6 (Light)
              "background-dark": "#000000", // iOS System Black
              "surface-light": "#FFFFFF",
              "surface-dark": "#1C1C1E", // iOS System Gray 6 (Dark)
              "divider-light": "#C6C6C8",
              "divider-dark": "#38383A",
              "ios-gray": "#8E8E93",
              "ios-green": "#34C759",
              "ios-red": "#FF3B30",
            },
            fontFamily: {
              sans: ["-apple-system", "BlinkMacSystemFont", "Segoe UI", "Roboto", "Helvetica", "Arial", "sans-serif"],
            },
            boxShadow: {
                'ios': '0 1px 2px rgba(0,0,0,0.05)',
                'glow': '0 0 20px rgba(0, 122, 255, 0.5)'
            }
          },
        },
      };
    </script>
    <style>
        body {
            -webkit-tap-highlight-color: transparent;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        .toggle-checkbox:checked {
            right: 0;
            border-color: #34C759;
        }
        .toggle-checkbox:checked + .toggle-label {
            background-color: #34C759;
        }
        .time-picker-mask {
            background: linear-gradient(to bottom, 
                var(--mask-color) 0%, 
                rgba(0,0,0,0) 40%, 
                rgba(0,0,0,0) 60%, 
                var(--mask-color) 100%);
            pointer-events: none;
        }
        html.dark { --mask-color: #1C1C1E; }
        html:not(.dark) { --mask-color: #FFFFFF; }
        
        .snap-y {
            scroll-snap-type: y mandatory;
        }
        .snap-center {
            scroll-snap-align: center;
        }
    </style>
  <script type="importmap">
{
  "imports": {
    "react-router-dom": "https://esm.sh/react-router-dom@^7.13.0",
    "react/": "https://esm.sh/react@^19.2.4/",
    "react": "https://esm.sh/react@^19.2.4",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
  <body class="bg-black text-gray-900 dark:text-white antialiased transition-colors duration-200">
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
