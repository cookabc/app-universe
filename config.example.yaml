# Example configuration file for Website Health Check System

# Target website configuration
target_url: "https://chelseayao.com"
user_agent: "HealthCheck/1.0"

# Global settings
max_concurrent_assessments: 5
request_timeout: 30
retry_attempts: 3
verbose_logging: false

# Module configurations
static_analysis:
  enabled: true
  timeout: 300
  parameters: {}

performance:
  enabled: true
  timeout: 300
  page_speed_api_key: null  # Set your API key here
  gtmetrix_api_key: null    # Set your API key here
  webpagetest_api_key: null # Set your API key here
  test_locations: ["Dulles:Chrome"]
  mobile_test: true

security:
  enabled: true
  timeout: 300
  ssl_labs_api_key: null    # Set your API key here
  vulnerability_scan_depth: "medium"  # light, medium, deep
  check_dependencies: true

accessibility:
  enabled: true
  timeout: 300
  wcag_level: "AA"          # A, AA, AAA
  wcag_version: "2.1"
  color_contrast_threshold: 4.5

seo:
  enabled: true
  timeout: 300
  google_search_console_key: null  # Set your API key here
  check_structured_data: true
  analyze_social_tags: true

# Report configuration
report:
  output_format: ["html", "json"]
  output_directory: "reports"
  include_screenshots: true
  detailed_recommendations: true