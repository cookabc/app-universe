services:
  - type: web
    name: stock-platform-api
    runtime: python
    plan: free
    buildCommand: pip install -r api/requirements.txt
    startCommand: cd api && gunicorn -w 2 -b 0.0.0.0:$PORT app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.0
      - key: FLASK_ENV
        value: production
      - key: DATABASE_URL
        value: sqlite:///data/stock_platform.db
    disk:
      name: data
      mountPath: /opt/render/project/src/api/data
      sizeGB: 1
