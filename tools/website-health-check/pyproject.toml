[project]
name = "website-health-check"
version = "0.1.0"
description = "A comprehensive website analysis tool for evaluating HTML structure, SEO, and accessibility"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.14.3",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
    "pyyaml>=6.0.3",
    "requests>=2.32.5",
]

[project.scripts]
health-check = "health_check_cli:main"
website-health-check = "health_check_cli:main"

[project.urls]
Homepage = "https://github.com/your-username/website-health-check"
Repository = "https://github.com/your-username/website-health-check"
Issues = "https://github.com/your-username/website-health-check/issues"
